name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all history
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact --no-banner'
  check:
    name: Compile scripts and validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile skills/video-walkthrough/scripts/*.py
      - run: python -c "import json,sys; [json.load(open(p)) for p in sys.argv[1:]]; print('json ok')" .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json skills/video-walkthrough/scenes/lower_thirds.json
      - run: bash -n skills/video-walkthrough/scripts/run_vo.sh
      - name: SKILL.md frontmatter
        run: |
          head -1 skills/video-walkthrough/SKILL.md | grep -qx -- '---'
          grep -q '^name: video-walkthrough$' skills/video-walkthrough/SKILL.md
          grep -q '^description: ' skills/video-walkthrough/SKILL.md
