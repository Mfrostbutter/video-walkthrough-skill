<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Title</title>
<link rel="stylesheet" href="brand.css">
<style>
  .wrap { position: absolute; left: 96px; top: 300px; width: 1500px; }
  .capsule { margin-bottom: 40px; }
  h1 { font-size: 112px; font-weight: 500; line-height: 1.02; letter-spacing: -0.01em; }
  h1 span { color: var(--type-accent); }
  p { margin-top: 36px; font-size: 40px; line-height: 1.3; color: var(--type-secondary); max-width: 1300px; }
  .foot { position: absolute; left: 96px; bottom: 80px; font-size: 24px; color: var(--type-secondary); }
</style></head>
<body>
  <!-- Headline fits about 22 characters per line at 112 px; subtitle about 60 per line at 40 px. -->
  <div class="logo"><img src="file:///abs/path/logo-on-dark.svg" alt="logo"></div>
  <div class="wrap">
    <div class="capsule mono fade">Walkthrough</div>
    <h1 class="fade d1">Product name<br><span>for the platform</span></h1>
    <p class="fade d2">One sentence on what it does for the viewer.</p>
  </div>
  <div class="foot mono fade d3">Kicker · package-or-product-id</div>
  <div class="bar"></div>
</body></html>
