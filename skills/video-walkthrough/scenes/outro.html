<html lang="en"><head><meta charset="utf-8"><title>Outro</title>

    <img src="file:///abs/path/logo-on-dark.svg" alt="logo">
    <h1>Product name<br><span>the line the voice ends on.</span></h1>

  <div class="bar"></div>
